<html>
<head>
	<style>
		body {
			background: #111;
			margin: 0;
			padding: 0;
			font-family: Verdana, sans-serif;
			font-size: calc(12px + 3vh - 1vw);
			overflow: hidden;
		}
		canvas {
			border: solid 1px black;
		}
		b {
			display: block;
			padding: 1em;
			border-radius: 0.4em;
			position: absolute;
			background: #1116;
			color: #f9f;
			font-size: 50%;
		}
		progress {
			accent-color: #f9f;
		}
		#atmos {
			accent-color: #39f;
		}
		#alt, #th {
			border: ridge .5vmin;
			box-shadow: 0 0 1vmin #0005;
		}
		#alt {
			top: 2vh;
			left: 40vw;
		}
		#th {
			bottom: 2vh;
			left: 2vh;
		}
		i {
			font-family: 'Courier New', monospace;
			font-size: 1rem;
		}
		#msn {
			top: 2vh;
			right: 2vh;
		}
		ol {
			padding: 0;
		}
		li {
			display: block;
			padding: 1em;
			margin: 0.4em 0;
			background: #0003;
		}
		li:hover {
			cursor: pointer;
			background: #000;
			text-decoration: underline;
		}
		#msndone {
			color: #ff5;
		}
	</style>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<link rel=icon href=data:,>
	<!-- <link rel=icon href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛳</text></svg>"> -->
</head>
<body>
<canvas id=a></canvas>
<b id=alt>Altitude: <i id=altn></i><br>
	<progress id=atmos value=0 max=1></progress>
	<div>Atmosphere</div>
</b>
<b id=th>
	Mode (Tab): <i id=elMode></i>
	<br>Throttle (Shift, Ctrl, Z, X):
	<progress id=thp value=0 max=1></progress>
	<i id=thn></i>
	<br>Speed: <i id=spdn></i>
</b>
<b id=msn>
	Mission <i id=msnnum></i>/<i id=msntot></i>
	<br>
	<ol id=msnos>
		<li>Do thing</li>
		<li>Do another thing</li>
	</ol>
	<div id=msndone></div>
</b>
</body>
<script type="module" src="./src/game.js"></script>
</html>
