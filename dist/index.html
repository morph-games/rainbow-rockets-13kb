<html>
<head>
	<style>
		body {
			background: #111;
			margin: 0;
			padding: 0;
			font-family: Verdana, sans-serif;
			font-size: calc(12px + 1vmin);
			overflow: hidden;
		}
		canvas {
			border: solid 1px black;
		}
		div, b, u {
			display: block;
			box-sizing: border-box;
			text-decoration: none;
		}
		u {
			display: inline-block;
			padding: 1vh 3vw;
			min-width: 6em;
			margin: 1em;
			border: solid 2px #f9f;
			border-radius: 0.8em;
			text-align: center;
			cursor: pointer;
			user-select: none;
			background: #0004;
			box-shadow: 0 .5em .25em #0002;
		}
		u:hover {
			background: #0006;
		}
		u:active {
			scale: 0.92;
			background: #0006;
		}
		#tp, #bm {
			padding: 1em;
			border-radius: 0.4em;
			position: absolute;
			color: #f9f;
			font-size: 50%;
			width: 100%;
			display: flex;
			justify-content: space-between;
		}
		#tp {
			top: 0;
			align-items: flex-start;
		}
		#tp > b {
			padding: 1em;
			background: #1116;
		}
		#bm {
			bottom: 0;
			align-items: flex-end;
		}
		progress {
			accent-color: #f9f;
		}
		#atmos {
			accent-color: #39f;
		}
		#alt {
			border: ridge .5vmin;
			box-shadow: 0 0 1vmin #0005;
		}
		#alt {
			top: 2vh;
			left: 40vw;
		}
		#th {
			bottom: 2vh;
			left: 2vh;
			text-align: right;
		}
		i {
			font-family: 'Courier New', monospace;
			font-size: 1rem;
		}
		#msn {
			top: 2vh;
			right: 2vh;
		}
		ol {
			padding: 0;
		}
		li {
			display: block;
			padding: 1em;
			margin: 0.4em 0;
			background: #0003;
		}
		li:hover {
			cursor: pointer;
			background: #000;
			text-decoration: underline;
		}
		#msndone {
			color: #ff5;
		}
		#fl {
			writing-mode: vertical-lr;
			/* rotate: 90deg; */
		}
		.m {
			padding: 2vh 6vw;
		}
		#oc {
			scale: 0;
			max-height: 0;
		}
		#oc.show {
			scale: 1;
			max-height: 40vh;
		}
		#spl {
			display: none;
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			text-align: center;
			color: #fff;
			background: linear-gradient(45deg, #f00a, #f70a, #ee0a, #3c0a, #22ea, #c0ca);
		}
		h1 {
			transform: skew(-2deg, -15deg);
			 text-shadow: 
			 	2px 2px 0 #f07,
				4px 4px 0 #f07,
				6px 6px 0 #f07,
				10px 10px 0 #22e,
				14px 14px 0 #70f,
				7px 7px 1em #0007;
			font-size: 10vmin;
			text-transform: uppercase;
			margin: 1em 0;
			letter-spacing: .2em;
		}
	</style>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<link rel=icon href=data:,>
	<!-- <link rel=icon href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛳</text></svg>"> -->
  <script type="module" crossorigin src="./assets/index-BrKkhI8Z.js"></script>
</head>
<body>
<canvas id=a></canvas>
<b id=tp>
	<b id=fl>
		Fuel <progress id=flp value=0 max=1></progress>
	</b>
	<b id=alt>
		Altitude: <i id=altn></i><br>
		<progress id=atmos value=0 max=1></progress>
		<b>Atmosphere</b>
		<br>Speed: <i id=spdn></i>
	</b>
	<b id=msn>
		Mission <i id=msnnum></i>/<i id=msntot></i>
		<br>
		<ol id=msnos>
			<li>Do thing</li>
			<li>Do another thing</li>
		</ol>
		<div id=msndone></div>
	</b>
</b>
<b id=bm>
	<b>
		<u data-key=l class=m>&larr; [A]</u><u data-key=r class=m>[D] &rarr;</u>
		<!-- TODO: Left/right controls -->
		<b>Throttle:
			<progress id=thp value=0 max=1></progress>
			<i id=thn></i>
		</b>
		<u data-key=C>&darr; [Ctrl, X]</u>
		<u data-key=H>&uarr; [Shift, Z]</u>
	</b>
	<!-- TODO: Navbar -->
	<!--
	<b>
	</b>
	-->
	<b id=th>
		<u data-key=u class=m>Burst Thrust [W,&uarr;]</u>
		<div id=oc>
			Mode: <i id=elMode></i><br>
			<u data-key=T>Switch Mode [Tab]</u>
			<br>
			<u data-key=B>Reset [Backspace]</u>
		</div>
		<u data-key=c>Other Controls [C]</u>
	</b>
</b>
<b id=spl>
	Unicorn Space Program
	<h1>Rainbow</h1>
	<h1>Rockets</h1>
	<u data-key=u>Start [Enter]</u>
</b>
</body>
</html>
